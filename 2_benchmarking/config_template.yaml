info:
    description: 'Evaluate the prioritization power among candidate genes'
    date: '2025-07-28'
    version: '1.0.2'

# changable parameters: job_name, split_version, output_dir, adata_file, split_file, layer_name, subset_name
trainer:
    job_name: '{job_name}'
    version: '{split_version}' # will be replaced by the version in the data_file
    output_dir: '{output_dir}'
    max_epochs: 500
    device: 'cuda'
    train_metrics: ['RelPos', 'label#AUROC']
    test_metrics: 'all'
    bar_metrics: ['RelPos', 'label#AUROC']
    monitor_metric: 'RelPos'
    monitor_mode: 'max'
    debugging: false
    early_stopping: true
    patience: 10
    monitor_ma_window: 5
    learning_rate: 0.001
    mixing_strategy: 'uncertainty'
    cotrain_weight: 1.0
    loss_weights:
        vae: 1.0
        dis: 10.0
        cls: 1000.0
    seed: 42 # for model initialization


dataset:
    data_dir: '../datasets/{job_name}'
    adata_file: '{adata_file}'
    split_file: '{split_file}'
    sample_size: 50
    batch_size: 512
    num_workers: 0
    layer_name: '{layer_name}'
    var_subset: '{subset_name}'
    cotrain_mode: false
    condition_key: 'perturbation'
    source_cell: 'control'
    sample_neg: true
    resampling_mode: true
    
identifier:
    pe_type: 'none'
    organism: null
    finetune: false
    rec_loss: 'mse'
    dis_loss: 'edist_euclidean'
    cls_loss: 'focal_loss'
    extractor_type: 'attn'


extractor:
    dim_genes: null
    dim_hidden: 512
    num_layers: 2
    dim_latent: 128
    dropout: 0.1
    use_batch_norm: True
    use_layer_norm: False
    act: 'leakyrelu'
    # d: 'euclidean' # if extractor_type is 'ot', d can be distance metric accepted by ot.da.SinkhornTransport
    # w: 'learned' # if extractor_type is 'ot', w can be 'learned' or 'uniform'
    temperature: 3.0
    variational: False

fuser:
    strategy: 'bilinear'
    dim_feat: 1
