info:
    description: 'Evaluate the discriminative power under different perturbation effeciency'
    date: '2025-07-28'
    version: '1.0.2'

trainer:
    job_name: 'hardeff'
    version: '{n_deg}_{per_strength}_{extractor_type}' # will be replaced by the version in the data_file
    output_dir: '../results/supp'
    max_epochs: 500
    device: 'cuda'
    train_metrics: ['label#AUROC', 'label#AUPRC']
    test_metrics: 'core_samplelevel'
    bar_metrics: ['label#AUROC']
    monitor_metric: 'label#AUROC'
    monitor_mode: 'max'
    monitor_ma_window: 5
    debugging: false
    early_stopping: true
    patience: 10
    learning_rate: 0.001
    mixing_strategy: 'uncertainty'
    cotrain_weight: 1.0
    loss_weights:
        vae: 1.0
        dis: 10.0
        cls: 100.0
    seed: 42

dataset:
    data_dir: '../datasets/wu/hardeff'
    adata_file: 'simulation_{n_deg}_{per_strength}.h5ad'
    split_file: 'split_random.csv'
    sample_size: 200 # useless when resampling_mode is false
    batch_size: 1024
    num_workers: 1
    layer_name: 'X'
    var_subset: 'all'
    cotrain_mode: false
    condition_key: 'perturbation'
    source_cell: 'control'
    sample_neg: true
    resampling_mode: true
    
identifier:
    pe_type: 'none'
    organism: null
    finetune: false
    rec_loss: 'mse'
    dis_loss: 'edist_euclidean'
    cls_loss: 'focal_loss'
    extractor_type: '{extractor_type}'

extractor:
    dim_genes: null
    dim_hidden: 256
    num_layers: 2
    dim_latent: 32
    use_batch_norm: false
    use_layer_norm: true
    act: 'leakyrelu'
    d: 'euclidean'
    w: 'learned'
    temperature: 1.0
    variational: false

fuser:
    strategy: 'bilinear'
    dim_feat: 1 # if null, will be set to dim_latent of extractor
